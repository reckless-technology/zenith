name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build (LTO, release)
        run: make
      - name: Perft (move-gen correctness — must pass)
        run: ./zenith perft
      - name: Bench (fixed-depth node signature)
        run: ./zenith bench 12

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting (repo .clang-format)
        run: clang-format --dry-run --Werror src/*.cpp src/*.h
