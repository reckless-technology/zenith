name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Build + run the correctness gates on Linux and Windows, and upload the binaries as artifacts.
  # Windows builds with the MSYS2 CLANG64 toolchain (a POSIX-ish clang: strtok_r, winpthreads, lld/LTO).
  # macOS is EXCLUDED here on cost grounds (its runners bill 10x on private repos): it builds and runs the
  # full gates — including the bench-signature assertion — in the release workflow instead, so the
  # cross-platform reproducibility guarantee is enforced on every release candidate rather than every push.
  # Every gate is exact-integer and identical on all platforms: the whole behavior-affecting engine,
  # including the LMR table (Q28 fixed point from a generated ln table), is pure integer arithmetic.
  build-and-test:
    name: build-and-test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux,   os: ubuntu-latest,  shell: bash,        arch: x86-64-v2, bin: build/zenith,     binext: "",     platform: linux-x86-64 }
          - { label: windows, os: windows-latest, shell: "msys2 {0}", arch: x86-64-v2, bin: build/zenith.exe, binext: ".exe", platform: windows-x86-64 }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the version's build number (git commit count) is correct

      - name: Install clang (Linux)
        if: matrix.label == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Set up MSYS2 + clang toolchain (Windows)
        if: matrix.label == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            make
            git
            python

      - name: Resolve build version (major.minor.commit-count -> e.g. 1.0.101)
        id: ver
        run: |
          major=$(sed -n 's/^#define ZENITH_VERSION_MAJOR \([0-9]*\).*/\1/p' src/version.h)
          minor=$(sed -n 's/^#define ZENITH_VERSION_MINOR \([0-9]*\).*/\1/p' src/version.h)
          build=$(git rev-list --count HEAD)
          echo "version=${major}.${minor}.${build}" >> "$GITHUB_OUTPUT"

      - name: Build (LTO, release)
        run: make ARCH=${{ matrix.arch }}

      - name: Build the datagen tools (Linux only; build-only bitrot guard for build/zenith-datagen + build/zenith-bullet2text)
        if: matrix.label == 'linux'
        run: make datagen ARCH=${{ matrix.arch }}

      - name: Perft (move-gen correctness — must pass)
        run: ./${{ matrix.bin }} perft

      - name: Legality oracle (is_legal_fast == is_legal over a perft walk)
        run: ./${{ matrix.bin }} legalcheck

      - name: SEE unit tests (static_exchange_eval vs hand-verified captures)
        run: ./${{ matrix.bin }} seecheck

      - name: Polyglot book keys (9 official spec vectors)
        run: ./${{ matrix.bin }} bookcheck

      - name: Adversarial-input hardening (malformed FEN/UCI)
        run: ./${{ matrix.bin }} fuzzcheck

      - name: Bench (fixed-depth node-signature gate — reproducible on every platform)
        # bench self-checks each position's node count against the values pinned in src/uci.c (BenchCases) and
        # exits non-zero on any mismatch — no external signature to keep in sync. A divergence here would mean a
        # non-portable computation crept into the search; if a change moves the signature intentionally, re-run
        # `./build/zenith bench` and update BenchCases in src/uci.c.
        run: ./${{ matrix.bin }} bench

      - name: UCI smoke (coordinator thread + Lazy SMP helpers + time management)
        # bench exercises the search inline on the calling thread; this is the only step that spawns the
        # coordinator + helper threads (the platform.h shim — winpthreads on Windows) and drives the real
        # GUI-facing path: options, position/moves replay, fixed-depth and clocked searches, bestmove.
        run: |
          printf 'uci\nisready\nsetoption name Threads value 2\nposition startpos moves e2e4 e7e5\ngo depth 10\nucinewgame\nposition startpos\ngo movetime 200\nquit\n' | ./${{ matrix.bin }} > uci_smoke.out
          test "$(grep -c '^bestmove ' uci_smoke.out)" = "2" || { echo '::error::UCI smoke expected 2 bestmove lines'; cat uci_smoke.out; exit 1; }

      - name: NNUE gates on a synthetic net (loader + incremental accumulator + finny cache + EvalFile search)
        # nets/ is gitignored, so CI generates a valid-format random-weight net: the nnuecheck gate
        # (incremental == refresh) and the loader are weight-agnostic, so this exercises the whole NNUE
        # path without committing a 6.3MB network.
        run: |
          python3 tools/make_test_net.py test_net.nnue
          ./${{ matrix.bin }} nnuecheck test_net.nnue
          echo "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1" | ./${{ matrix.bin }} nnueeval test_net.nnue
          printf 'setoption name EvalFile value test_net.nnue\nsetoption name Threads value 2\nposition startpos\ngo depth 8\nquit\n' | ./${{ matrix.bin }} | grep -q '^bestmove ' || { echo '::error::EvalFile search produced no bestmove'; exit 1; }

      - name: Name the binary with the build version
        run: cp "${{ matrix.bin }}" "zenith-${{ steps.ver.outputs.version }}-${{ matrix.platform }}${{ matrix.binext }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenith-${{ steps.ver.outputs.version }}-${{ matrix.platform }}
          path: zenith-${{ steps.ver.outputs.version }}-${{ matrix.platform }}${{ matrix.binext }}
          if-no-files-found: error

  # AddressSanitizer + UBSan build and memory-safety gates (Linux only — the sanitizer build is where OOB /
  # UB regressions surface; the movegen/legality/fuzz walks are the highest-value things to run under it).
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build with AddressSanitizer + UndefinedBehaviorSanitizer
        run: make debug
      - name: Perft under ASan/UBSan
        run: ./build/zenith-debug perft
      - name: Legality oracle under ASan/UBSan
        run: ./build/zenith-debug legalcheck
      - name: Adversarial-input fuzz under ASan/UBSan (memory-safety gate)
        run: ./build/zenith-debug fuzzcheck
      - name: UCI smoke under ASan/UBSan (threaded search — coordinator + Lazy SMP helper)
        run: |
          printf 'setoption name Threads value 2\nposition startpos\ngo depth 9\nquit\n' | ./build/zenith-debug > uci_smoke.out
          grep -q '^bestmove ' uci_smoke.out || { echo '::error::no bestmove under ASan'; cat uci_smoke.out; exit 1; }
      - name: NNUE gate on a synthetic net under ASan/UBSan
        run: |
          python3 tools/make_test_net.py test_net.nnue
          ./build/zenith-debug nnuecheck test_net.nnue

      - name: Build the datagen tools with ASan/UBSan (they live outside src/, so `make debug` skips them)
        run: make datagen-debug

      - name: Datagen smoke under ASan/UBSan (2 self-play games at a tiny node budget)
        run: |
          ./build/zenith-datagen-debug 2 datagen_smoke.txt 1 200 4
          [ -s datagen_smoke.txt ] || { echo '::error::datagen produced no records'; exit 1; }

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format-18 (pinned to match local; clang-format output is not stable across versions)
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting (repo .clang-format)
        run: clang-format-18 --dry-run --Werror src/*.c src/*.h datagen/*.c datagen/*.h
