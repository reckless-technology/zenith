name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Every job runs on a GitHub-hosted runner, free for a public repository, its image pinned by version
  # (ubuntu-24.04, windows-2025) rather than -latest, so a new image arrives by a change here. Each job installs what
  # it needs: Ubuntu 24.04's clang (and its LLVM tools) from apt, MSYS2's CLANG64 toolchain through setup-msys2, and
  # clang-format 22.1.8 from PyPI.

  # Build + run the correctness gates on Linux and Windows, and upload the binaries as artifacts (for a look at a
  # commit's build; releases are built from nothing by release.yml on a pushed vMAJOR.MINOR tag, and signed).
  # Windows builds with the MSYS2 CLANG64 toolchain (a POSIX-ish clang: strtok_r, winpthreads, lld/LTO).
  # macOS is not built here: it builds and runs the full gates — including the bench-signature assertion — in
  # the release workflow (and macos-check.yml by hand), so the cross-platform reproducibility guarantee is
  # enforced on every release candidate.
  # Every gate is exact-integer and identical on all platforms: the whole behavior-affecting engine,
  # including the LMR table (Q28 fixed point from a generated ln table), is pure integer arithmetic.
  build-and-test:
    name: build-and-test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux,   os: ubuntu-24.04, shell: bash,        arch: x86-64-v2, bin: build/zenith,     binext: "",     platform: linux-x86-64 }
          - { label: windows, os: windows-2025, shell: "msys2 {0}", arch: x86-64-v2, bin: build/zenith.exe, binext: ".exe", platform: windows-x86-64 }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and the tags: tools/version.sh derives the version from them

      - name: Install clang (Linux; Ubuntu 24.04's, LLVM 18)
        if: matrix.label == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang && clang --version

      - name: Set up MSYS2 + clang toolchain (Windows)
        if: matrix.label == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            make
            git
            python

      - name: Resolve build version (MAJOR.MINOR.BUILD from the nearest vMAJOR.MINOR tag, as the Makefile does)
        id: ver
        run: echo "version=$(tools/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build (LTO, release)
        run: make ARCH=${{ matrix.arch }}

      # The engine imports Windows' own DLLs alone: MSYS2's runtime (libwinpthread-1.dll) is linked statically
      # (RELEASE_LDFLAGS), so it starts on a Windows with no MSYS2. A toolchain runtime DLL among its imports fails.
      - name: Windows DLLs the engine imports (Windows only)
        if: matrix.label == 'windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/windows-dependents.ps1 ${{ matrix.bin }}
          if ($LASTEXITCODE -ne 0) { throw "the engine imports a DLL outside the allowlist" }

      - name: Build the datagen tools (Linux only; build-only bitrot guard for build/zenith-datagen + build/zenith-bullet2text)
        if: matrix.label == 'linux'
        run: make datagen ARCH=${{ matrix.arch }}

      - name: Perft (move-gen correctness — must pass)
        run: ./${{ matrix.bin }} perft

      - name: Legality oracle (is_legal_fast == is_legal over a perft walk)
        run: ./${{ matrix.bin }} legalcheck

      - name: SEE unit tests (static_exchange_eval vs hand-verified captures)
        run: ./${{ matrix.bin }} seecheck

      - name: Polyglot book keys (9 official spec vectors)
        run: ./${{ matrix.bin }} bookcheck

      - name: Embedded opening book (blob, entry invariants, probe path — the artifact `OwnBook true` plays from)
        run: ./${{ matrix.bin }} embookcheck

      - name: Adversarial-input hardening (malformed FEN/UCI)
        run: ./${{ matrix.bin }} fuzzcheck

      - name: Bench (fixed-depth node-signature gate — reproducible on every platform)
        # bench self-checks each position's node count against the values pinned in src/uci.c (BenchCases) and
        # exits non-zero on any mismatch — no external signature to keep in sync. A divergence here would mean a
        # non-portable computation crept into the search; if a change moves the signature intentionally, re-run
        # `./build/zenith bench` and update BenchCases in src/uci.c.
        run: ./${{ matrix.bin }} bench

      - name: UCI smoke (coordinator thread + Lazy SMP helpers + time management)
        # bench exercises the search inline on the calling thread; this is the only step that spawns the
        # coordinator + helper threads (the platform.h shim — winpthreads on Windows) and drives the real
        # GUI-facing path: options, position/moves replay, fixed-depth and clocked searches, bestmove.
        run: |
          printf 'uci\nisready\nsetoption name Threads value 2\nposition startpos moves e2e4 e7e5\ngo depth 10\nucinewgame\nposition startpos\ngo movetime 200\nquit\n' | ./${{ matrix.bin }} > uci_smoke.out
          test "$(grep -c '^bestmove ' uci_smoke.out)" = "2" || { echo '::error::UCI smoke expected 2 bestmove lines'; cat uci_smoke.out; exit 1; }

      - name: UCI front end (every option, position and go form, the notation subcommands, nnueeval, malformed input)
        run: python3 tools/uci_check.py ./${{ matrix.bin }}

      - name: NNUE gates on a synthetic net (loader + incremental accumulator + finny cache + EvalFile search)
        # A second, synthetic net in the shared RNNUE1 container: the nnuecheck gate (incremental ==
        # refresh) and the loader are weight-agnostic, so this exercises the whole NNUE path - including
        # that a net stamped by tools/ is one the engine accepts - on weights no commit carries.
        run: |
          python3 tools/make_test_net.py test_net.nnue
          ./${{ matrix.bin }} nnuecheck test_net.nnue
          echo "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1" | ./${{ matrix.bin }} nnueeval test_net.nnue
          printf 'setoption name EvalFile value test_net.nnue\nsetoption name Threads value 2\nposition startpos\ngo depth 8\nquit\n' | ./${{ matrix.bin }} | grep -q '^bestmove ' || { echo '::error::EvalFile search produced no bestmove'; exit 1; }

      - name: Name the binary with the build version
        run: cp "${{ matrix.bin }}" "zenith-${{ steps.ver.outputs.version }}-${{ matrix.platform }}${{ matrix.binext }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenith-${{ steps.ver.outputs.version }}-${{ matrix.platform }}
          path: zenith-${{ steps.ver.outputs.version }}-${{ matrix.platform }}${{ matrix.binext }}
          if-no-files-found: error

  # AddressSanitizer + UBSan build and memory-safety gates (Linux only — the sanitizer build is where OOB /
  # UB regressions surface; the movegen/legality/fuzz walks are the highest-value things to run under it).
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang (Ubuntu 24.04's, LLVM 18)
        run: sudo apt-get update && sudo apt-get install -y clang && clang --version
      - name: Build with AddressSanitizer + UndefinedBehaviorSanitizer
        run: make debug
      - name: Perft under ASan/UBSan
        run: ./build/zenith-debug perft
      - name: Legality oracle under ASan/UBSan
        run: ./build/zenith-debug legalcheck
      - name: Adversarial-input fuzz under ASan/UBSan (memory-safety gate)
        run: ./build/zenith-debug fuzzcheck

      - name: Embedded opening book under ASan/UBSan (the blob is parsed into heap entries)
        run: ./build/zenith-debug embookcheck
      - name: UCI smoke under ASan/UBSan (threaded search — coordinator + Lazy SMP helper)
        run: |
          printf 'setoption name Threads value 2\nposition startpos\ngo depth 9\nquit\n' | ./build/zenith-debug > uci_smoke.out
          grep -q '^bestmove ' uci_smoke.out || { echo '::error::no bestmove under ASan'; cat uci_smoke.out; exit 1; }
      - name: NNUE gate on a synthetic net under ASan/UBSan
        run: |
          python3 tools/make_test_net.py test_net.nnue
          ./build/zenith-debug nnuecheck test_net.nnue

      - name: Build the datagen tools with ASan/UBSan (they live outside src/, so `make debug` skips them)
        run: make datagen-debug

      - name: Datagen smoke under ASan/UBSan (2 self-play games at a tiny node budget)
        run: |
          ./build/zenith-datagen-debug 2 datagen_smoke.txt 1 200 4
          [ -s datagen_smoke.txt ] || { echo '::error::datagen produced no records'; exit 1; }

  # Line coverage of src/ by every gate (`make coverage`: LLVM source-based, nnuecheck and the front-end gate included,
  # the latter's pseudo-terminal check too), failing under the Makefile's COVERAGE_MIN (90 %). src/ is what a release
  # ships; datagen/ and tools/ are developer tools and are not measured. It needs clang with its profile
  # runtime and the llvm-profdata / llvm-cov of the same LLVM: Ubuntu 24.04's clang and llvm (18) from apt, the tools
  # found by the Makefile (on the PATH, or llvm-profdata-18 beside clang 18).
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version is derived from the tags
      - name: Install clang and LLVM's tools (Ubuntu 24.04's, LLVM 18)
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Check the toolchain (clang, its profile runtime's tools, python3)
        run: |
          missing=""
          command -v clang >/dev/null || missing="$missing clang"
          command -v python3 >/dev/null || missing="$missing python3"
          if command -v clang >/dev/null; then
            major=$(clang -dumpversion | cut -d. -f1)
            for tool in llvm-profdata llvm-cov; do
              command -v "$tool" >/dev/null || command -v "$tool-$major" >/dev/null || missing="$missing $tool(-$major)"
            done
            clang --version | head -1
          fi
          if [ -n "$missing" ]; then
            echo "::error::coverage needs:$missing - LLVM's tools beside clang (apt: llvm-$major or llvm)"
            exit 1
          fi
      - name: Coverage of src/ by every gate (fails under COVERAGE_MIN)
        run: make coverage

  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # clang-format is version-sensitive - a different major restyles code that is already correct - so the
      # version is pinned to the organisation's 22.1.8 (see reckless-technology/claude-skills, skill
      # reckless-working-practice). Not apt: Ubuntu carries no clang-format-22, and the PyPI wheel is what the
      # development machines run, so CI and a developer's pre-commit hook agree. It goes into a venv of the job's own,
      # ahead of the image's clang-format on the PATH.
      - name: clang-format 22.1.8, from PyPI
        run: |
          venv="$RUNNER_TEMP/clang-format-venv"
          python3 -m venv "$venv"
          "$venv/bin/pip" install --quiet 'clang-format==22.1.8'
          echo "$venv/bin" >> "$GITHUB_PATH"
      - name: Check formatting (repo .clang-format)
        run: |
          clang-format --version
          clang-format --dry-run --Werror src/*.c src/*.h datagen/*.c datagen/*.h
