name: macOS check

# Manual compile+gate check on macOS. Exists because macOS is not in the per-push CI and builds only at release
# time - which let two Darwin-only breakages reach release runs. Dispatch this before cutting when
# platform-sensitive code changed. Runs on GitHub's hosted Apple-silicon image, pinned by version (macos-15), with
# its Xcode's clang.
on:
  workflow_dispatch:

jobs:
  macos-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build (Apple clang, arm64 — no -march)
        run: make ARCH=
      - name: Correctness gates + bench signature
        run: make check
