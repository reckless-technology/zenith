name: Release

# Manually promote the current main commit to a formal GitHub Release.
# Builds portable per-microarch Linux binaries, verifies them with the correctness gates, publishes the
# release, then bumps the minor version in src/version.h for the next development cycle. macOS and Windows
# build and verify here as release-only jobs (macOS runners bill 10x, Windows 2x): each attaches its
# artifacts to the release made by the linux job and asserts the bench signature cross-platform.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Extra release notes (optional; appended to the auto summary)"
        required: false
        default: ""
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write # create the release and push the version-bump commit

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: correct build number (commit count) + ability to push the bump

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Resolve version
        id: ver
        run: |
          major=$(grep -oP '#define ZENITH_VERSION_MAJOR \K[0-9]+' src/version.h)
          minor=$(grep -oP '#define ZENITH_VERSION_MINOR \K[0-9]+' src/version.h)
          build=$(git rev-list --count HEAD)
          tag="v${major}.${minor}.${build}"
          echo "major=$major"   >> "$GITHUB_OUTPUT"
          echo "minor=$minor"   >> "$GITHUB_OUTPUT"
          echo "build=$build"   >> "$GITHUB_OUTPUT"
          echo "tag=$tag"       >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists"; exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Two portable variants: x86-64-v2 runs on essentially any modern x86-64 (magic bitboards);
      # x86-64-v3 guarantees BMI2, so it ships the faster PEXT sliding-attack build.
      - name: Build x86-64-v2 (baseline, magic)
        run: |
          make clean && make ARCH=x86-64-v2
          mv build/zenith zenith-x86-64-v2

      - name: Build x86-64-v3 (PEXT/BMI2)
        run: |
          make clean && make ARCH=x86-64-v3 pext
          mv build/zenith-pext zenith-x86-64-v3-pext

      # Verify the shipped binary with the arch-independent correctness gates (perft/legality/SEE/book are
      # exact integer checks — no cross-arch float sensitivity). The bench-signature determinism guard runs
      # on every push in ci.yml; a release is cut from an already-green main.
      - name: Verify (correctness gates on the v2 binary)
        run: |
          cp zenith-x86-64-v2 zenith
          ./zenith perft
          ./zenith legalcheck
          ./zenith seecheck
          ./zenith bookcheck
          ./zenith fuzzcheck

      - name: Package
        run: |
          tag=${{ steps.ver.outputs.tag }}
          for variant in x86-64-v2 x86-64-v3-pext; do
            install -D "zenith-$variant" "pkg/zenith"
            cp README.md LICENSE pkg/
            tar -C pkg -czf "zenith-${tag}-linux-${variant}.tar.gz" zenith README.md LICENSE
            rm -rf pkg
          done
          sha256sum zenith-${tag}-linux-*.tar.gz > "zenith-${tag}-SHA256SUMS.txt"
          ls -la zenith-${tag}-linux-*.tar.gz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ steps.ver.outputs.tag }}
          {
            echo "Zenith ${tag} — UCI chess engine (C17, king-bucketed NNUE)."
            echo
            echo "Prebuilt binaries (Linux tarballs, Windows zips, macOS arm64 tarball):"
            echo "- \`x86-64-v2\` — broad compatibility (magic bitboards), runs on essentially any modern x86-64."
            echo "- \`x86-64-v3-pext\` — requires AVX2/BMI2 (Intel Haswell+ / AMD Zen3+); faster PEXT sliding attacks."
            echo
            echo "Verify downloads against \`SHA256SUMS.txt\`. Bit-identical search to the tagged source (bench signature guarded in CI)."
            if [ -n "${{ github.event.inputs.notes }}" ]; then echo; echo "${{ github.event.inputs.notes }}"; fi
          } > notes.md
          gh release create "$tag" \
            zenith-${tag}-linux-*.tar.gz "zenith-${tag}-SHA256SUMS.txt" \
            --title "Zenith ${tag}" \
            --notes-file notes.md \
            ${{ github.event.inputs.prerelease == 'true' && '--prerelease' || '' }}

      - name: Bump minor version for the next cycle
        # main requires PRs + green CI (ruleset "protect-main"); this one mechanical commit is the sanctioned
        # exception, pushed with the RELEASE_BUMP_KEY deploy key, which is the ruleset's only bypass actor.
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_BUMP_KEY }}
        run: |
          major=${{ steps.ver.outputs.major }}
          next=$(( ${{ steps.ver.outputs.minor }} + 1 ))
          sed -i -E "s/(#define ZENITH_VERSION_MINOR )[0-9]+/\1${next}/" src/version.h
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/version.h
          git commit -m "chore: bump version to ${major}.${next} after ${{ steps.ver.outputs.tag }} release"
          mkdir -p ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/release_bump && chmod 600 ~/.ssh/release_bump
          GIT_SSH_COMMAND="ssh -i ~/.ssh/release_bump -o IdentitiesOnly=yes" \
            git push git@github.com:jonny-reckless/zenith.git HEAD:main

  # macOS: release candidates only (excluded from per-push CI on cost grounds). Runs the FULL gate suite —
  # including the bench node-signature assertion, which is where the cross-platform reproducibility
  # guarantee is now enforced — then attaches the arm64 tarball + checksum to the release made above.
  # Runs on the org's Apple-silicon runner (reckless-ci-mac-1), not a hosted macos-latest runner.
  release-macos:
    needs: release
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the version banner's build number is the commit count

      - name: Resolve tag (must match the release job's computation)
        id: ver
        run: |
          major=$(sed -n 's/^#define ZENITH_VERSION_MAJOR \([0-9]*\).*/\1/p' src/version.h)
          minor=$(sed -n 's/^#define ZENITH_VERSION_MINOR \([0-9]*\).*/\1/p' src/version.h)
          build=$(git rev-list --count HEAD)
          echo "tag=v${major}.${minor}.${build}" >> "$GITHUB_OUTPUT"

      - name: Build (Apple clang, arm64 — no -march)
        run: make ARCH=

      - name: Correctness gates + bench signature
        run: make check

      - name: Package and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ steps.ver.outputs.tag }}
          install -d pkg && install build/zenith pkg/zenith && cp README.md LICENSE pkg/
          tar -C pkg -czf "zenith-${tag}-macos-arm64.tar.gz" zenith README.md LICENSE
          shasum -a 256 "zenith-${tag}-macos-arm64.tar.gz" > "zenith-${tag}-macos-arm64.tar.gz.sha256"
          gh release upload "$tag" "zenith-${tag}-macos-arm64.tar.gz" "zenith-${tag}-macos-arm64.tar.gz.sha256"

  # Windows: release candidates only, mirroring the CI leg's msys2/CLANG64 toolchain. Runs the full gate
  # suite (bench node-signature assertion included — the cross-platform reproducibility guarantee), then
  # attaches zips for both microarch variants to the release made above. Runners bill 2x: fine for releases.
  release-windows:
    needs: release
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: "msys2 {0}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the version banner's build number is the commit count

      - name: Set up MSYS2 + clang toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          release: false # self-hosted runner reckless-ci-win-0: use its preinstalled C:\msys64 instead of downloading MSYS2 each run
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            make
            git
            python
            zip

      - name: Resolve tag (must match the release job's computation)
        id: ver
        run: |
          major=$(sed -n 's/^#define ZENITH_VERSION_MAJOR \([0-9]*\).*/\1/p' src/version.h)
          minor=$(sed -n 's/^#define ZENITH_VERSION_MINOR \([0-9]*\).*/\1/p' src/version.h)
          build=$(git rev-list --count HEAD)
          echo "tag=v${major}.${minor}.${build}" >> "$GITHUB_OUTPUT"

      - name: Build x86-64-v2 (baseline, magic) + correctness gates
        run: |
          make ARCH=x86-64-v2
          make check ARCH=x86-64-v2

      - name: Package x86-64-v2
        run: |
          tag=${{ steps.ver.outputs.tag }}
          install -d pkg && install build/zenith.exe pkg/zenith.exe && cp README.md LICENSE pkg/
          (cd pkg && zip -q "../zenith-${tag}-windows-x86-64-v2.zip" zenith.exe README.md LICENSE)

      - name: Build x86-64-v3 (PEXT/BMI2) + bench signature
        run: |
          make clean && make ARCH=x86-64-v3 pext
          ./build/zenith-pext bench

      - name: Package x86-64-v3-pext and attach both to the release
        run: |
          tag=${{ steps.ver.outputs.tag }}
          rm -rf pkg && install -d pkg && install build/zenith-pext.exe pkg/zenith.exe && cp README.md LICENSE pkg/
          (cd pkg && zip -q "../zenith-${tag}-windows-x86-64-v3-pext.zip" zenith.exe README.md LICENSE)
          sha256sum zenith-${tag}-windows-*.zip > "zenith-${tag}-windows-SHA256SUMS.txt"

      - name: Upload assets
        shell: bash # Git Bash: gh is on the runner PATH here, unlike inside the msys2 shell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ steps.ver.outputs.tag }}
          gh release upload "$tag" zenith-${tag}-windows-*.zip "zenith-${tag}-windows-SHA256SUMS.txt"
